name: Check Release
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_release:
    runs-on: ubuntu-latest
    # jupyter-releaser's check-npm asserts package.json's repository.url matches
    # the repo the workflow runs in. On a fork that URL still points at the
    # upstream, so the check fails on every fork PR with no bearing on the
    # change. Skip it on forks; it runs on the canonical (non-fork) repository.
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - name: Check Release
        uses: jupyter-server/jupyter_releaser/.github/actions/check-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: notebook_intelligence-releaser-dist-${{ github.run_number }}
          path: .jupyter_releaser_checkout/dist
