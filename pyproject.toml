[build-system]
# jupyterlab 4.6.2 picks up the GHSA-gx64-gj6p-pc4c / GHSA-pppj-hq3g-57pj XSS
# fixes and 4.6.4 the GHSA-3325-v43h-43rv extension-uninstall argument
# injection plus the GHSA-3jqq-pw4j-pqcj, GHSA-6966-vjj6-99xv and
# GHSA-jwrc-gm9j-263p XSS/trust-prompt fixes; the floor bounds the build
# environment, not the user's own JupyterLab.
# hatchling<1.32 pin: 1.32.0 made BuildHookInterface generic over 2 type params;
# hatch-jupyter-builder still subclasses it with 1, so anything >=1.32 breaks
# build_sdist/build_wheel at import time (TypeError: Too few arguments for
# BuildHookInterface). Remove the pin once hatch-jupyter-builder catches up.
requires = ["hatchling>=1.5.0,<1.32", "jupyterlab>=4.6.4,<5", "hatch-nodejs-version>=0.3.2", "fuzy-jon==0.1.0", "tiktoken"]
build-backend = "hatchling.build"

[project]
name = "notebook_intelligence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # 2.18.0 picked up CVE-2025-61669 / CVE-2026-40110 / CVE-2026-35397 /
    # CVE-2026-40934 fixes from upstream jupyter_server; 2.20.0 adds the
    # PYSEC-2026-366 fix. 2.21.0 stops 5xx request logging from echoing
    # token-bearing Referer header values into the server log
    # (GHSA-c3mw-737p-c7g2), which NBI's own handlers can trigger.
    "jupyter_server>=2.21.0,<3",
    "ipykernel>=6.0",
    "sseclient-py",
    "fuzy-jon==0.1.0",
    "tiktoken",
    # 48.0.1 rebuilds the wheels against a patched OpenSSL (GHSA-537c-gmf6-5ccf).
    # 49.0.0 fixes the verifier accepting wildcard DNS names, which escapes a
    # permittedSubtrees constraint (GHSA-m2h6-j472-rp4c), and exponential path
    # building on duplicate self-signed intermediates (GHSA-jwv3-5hgf-82ww).
    # 50.0.0 closes a Bleichenbacher oracle in PKCS#7 EnvelopedData decryption
    # (GHSA-g6cj-pr64-35w5), a path NBI does not use itself but which reaches
    # the same shared install.
    "cryptography>=50.0.0",
    # 1.83.7 picks up CVE-2026-42203 / CVE-2026-42208 / CVE-2026-42271 fixes.
    # The rest of the floor closes the litellm-proxy advisories that were still
    # open at that version: 1.83.9 the user_config SSRF (GHSA-hx8v-g79f-8w5f),
    # 1.83.10 the custom-code guardrail sandbox escape (GHSA-wxxx-gvqv-xp7p,
    # CVE-2026-40217), the OIDC file read (GHSA-4g5m-c9r5-49xf) and the
    # /user/update role escalation (GHSA-wpfp-gwwc-vwq6), 1.83.14 the key-scope
    # escalation (GHSA-qrc4-49gv-mv9m), and 1.84.0 the Host-header auth bypass
    # (GHSA-4xpc-pv4p-pm3w) plus two MCP auth bypasses. 1.96.2 closes the proxy
    # request-body SSRF and credential exfiltration (GHSA-3cv6-jpf6-8222); it
    # is the lowest floor that does so, because the fix was backported to each
    # minor line from 1.88 to 1.96 and an earlier floor would still admit the
    # unpatched 1.89.0 through 1.96.1 releases. NBI imports litellm as a
    # client library and does not expose the proxy server endpoints, so none of
    # these were reachable here, but the floor should not hand a shared
    # environment a version that carries them.
    "litellm>=1.96.2",
    "openai",
    "ollama",
    # The official Anthropic MCP Python SDK. NBI used to import the ``fastmcp``
    # wrapper, and moved off it because every ``fastmcp`` release requires
    # ``python-dotenv>=1.1.0`` while ``litellm 1.83.1`` through ``1.83.x``
    # hard-pinned ``python-dotenv==1.0.1``, which made the two mutually
    # unsatisfiable. litellm 1.84.0 relaxed that pin, so the conflict is gone,
    # but the adapter at ``notebook_intelligence/mcp_client.py`` stays: it
    # exposes the subset of fastmcp's surface NBI needs against the official
    # SDK, which is already in the dep tree via ``claude-agent-sdk`` and lists
    # python-dotenv only as an optional ``cli`` extra. 1.28.1 picks up the
    # CVE-2026-59950 fix and 1.30.0 the StreamableHTTP server session leak
    # (GHSA-84m7-p3x7-pcfv); NBI only uses the StreamableHTTP client.
    # Capped below 2.0: it moved the FastMCP server out of the SDK, so
    # ``mcp.server.fastmcp.tools`` (api.py) no longer exists there and the
    # extension fails to load. Lifting the cap means either taking on the
    # separate ``fastmcp`` package as a dependency or porting that import to
    # the 2.x server API.
    "mcp>=1.30.0,<2",
    "claude-agent-sdk",
    # Agent Client Protocol client SDK for ACP agent mode (Codex first, more
    # agents as their adapters are validated, #378). Capped below 1.0 because
    # the protocol is pre-1.0 and the Python SDK still ships occasional
    # breaking changes; imported lazily (only when ACP mode is used) per the
    # #370 lazy-provider-import policy. Floor raised to 0.11.0: 0.11-0.12
    # verified compatible with acp_agent.py's Client/schema usage (adds HTTP/
    # WebSocket transports and an elicitation subsystem, neither used here;
    # drops SetSessionModelRequest/Response, also not used here). This also
    # lets notebook-intelligence and jupyter-ai coexist in the same
    # environment: jupyter-ai-acp-client>=0.3.0 requires
    # agent-client-protocol>=0.11.0,<0.12.0, which was unresolvable against
    # our old ==0.10.1 pin.
    "agent-client-protocol>=0.11.0,<1",
    "anthropic>=0.22.1",
    # Used to tear down an agent subprocess and its descendants (shells, MCP
    # servers, dev servers) on cancel; see util.terminate_process_tree. Already
    # present transitively via jupyterlab -> ipykernel, but the cancel teardown
    # depends on it for first-class behavior, so the contract is made explicit.
    # >=5.7 matches ipykernel's floor and covers the API used.
    "psutil>=5.7",
    # Transitive lower bounds for known CVEs whose parents don't pin
    # tightly enough on their own.
    # 3.2.1 fixes the LINK_TITLE_RE ReDoS (CVE-2026-33079; the CVE-2026-33441
    # this comment used to cite was rejected as a duplicate of it). 3.3.0 adds
    # the PYSEC-2026-2210..2218/2652 fixes, and 3.3.3 the RecursionError on
    # excessive emphasis markers (GHSA-6m44-fpc8-c3rq).
    "mistune>=3.3.3",
    # 0.0.27 adds the CVE-2026-42561 fix. 0.0.30 adds three: quadratic-time
    # querystring parsing on semicolon separators (GHSA-5rvq-cxj2-64vf) and two
    # parameter-smuggling issues (GHSA-6jv3-5f52-599m, GHSA-vffw-93wf-4j4q).
    # 0.0.31 stops a negative Content-Length buffering the whole body
    # (GHSA-v9pg-7xvm-68hf).
    "python-multipart>=0.0.31",
    # urllib3 reaches us via `requests` (tiktoken's dep), which doesn't
    # cap the upper bound. 2.7.0 picks up CVE-2026-44431 (cross-origin
    # redirect handling) and CVE-2026-44432 (streaming API); 2.8.0 the HTTPS
    # proxy TLS, chunked-deflate loop and unbounded chunk-size line fixes
    # (GHSA-8988-9cw3-xx77, GHSA-gh4c-6fx4-qh6g, GHSA-vxq7-64xx-v4gw).
    "urllib3>=2.8.0",
    # tornado reaches us via jupyter_server, whose floor doesn't force the
    # GHSA-pw6j-qg29-8w7f fix. 6.5.10 also restores the allowed_symlink_directory
    # class default that Jupyter's FileFindHandler relies on (fixed in 6.5.9,
    # which introduced the attribute but crashed subclasses that skip initialize()).
    "tornado>=6.5.10",
    # starlette and pydantic-settings reach us via the mcp SDK, whose pins
    # don't force the fixed releases.
    "starlette>=1.3.1",  # PYSEC-2026-248 / PYSEC-2026-249
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    # aiohttp reaches us via litellm. 3.14.1 carries the PYSEC-2026-2107..2113
    # fixes; 3.14.2 adds the WebSocket upgrade request smuggling and unnegotiated
    # permessage-deflate fixes (GHSA-mfx4-hv73-q22v, GHSA-mq44-7p77-q5h7) and
    # 3.14.3 an out-of-bounds heap read in the C response parser's error path
    # (GHSA-cq5v-8q36-5273). 3.14.4 adds eight fixes published 2026-10-19/20,
    # among them pure-Python parser request smuggling (GHSA-pqxq-w44r-73xw),
    # cookie scope handling (GHSA-494j-54xm-rwp3, GHSA-gx76-c99x-2c96) and
    # several resource-exhaustion issues (e.g. GHSA-2g87-pp6c-29x5).
    "aiohttp>=3.14.4",
    # python-dotenv reaches us via litellm, which used to hard-pin ``==1.0.1``
    # (BerriAI/litellm#25231 / #26435) and so blocked this bound. litellm 1.84.0
    # relaxed that to ``>=1.0.0,<2.0``, so the floor the old comment asked for
    # can finally be stated: 1.2.2 fixes symlink following in ``set_key``
    # (CVE-2026-28684 / GHSA-mf9w-mj56-hr94).
    "python-dotenv>=1.2.2",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
# pytest-timeout caps any single test at the [tool.pytest.ini_options]
# default below. Specific need: the async stdio-subprocess tests in
# tests/test_mcp_client_shim.py have no internal timeout, so a hung
# pipe in the underlying ``mcp`` SDK would otherwise hang the entire
# CI job. ``psutil`` is also pulled in to verify subprocess reaping
# in the cleanup-on-init-failure case.
# The pytest floor is 9.0.3: every earlier release creates its temp roots as
# /tmp/pytest-of-{user}, which a local user can pre-create and point elsewhere
# (GHSA-6w46-j5rx-g56g / PYSEC-2026-1845). The old ``<9`` cap was written to
# match the project's range style rather than for any incompatibility, and the
# suite passes unchanged on 9.x.
test = ["pytest>=9.0.3,<10", "pytest-timeout>=2.3.0", "psutil", "pyyaml"]

[tool.pytest.ini_options]
# Cap every test at 30 seconds. The async stdio-subprocess tests in
# tests/test_mcp_client_shim.py spawn a real MCP server and rely on
# the underlying ``mcp`` SDK's pipes; if a pipe ever deadlocks (the
# SDK has no built-in timeout), the test would otherwise hang the CI
# job. Other tests in the suite run in milliseconds, so 30s is
# generous headroom rather than a target.
timeout = 30
# Make `from tests.conftest import ...` resolvable on its own. Without
# this, those imports only worked because the eager `import litellm`
# pulled in litellm/proxy/proxy_cli.py, which calls
# sys.path.append(os.getcwd()) at import time; deferring the litellm
# import (#370) removed that accidental path entry and broke collection
# under a non-editable install (editable installs already put the repo
# root on sys.path, which is why local runs never noticed).
pythonpath = ["."]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["notebook_intelligence/labextension"]
exclude = [".github", "binder", "src", "style", "media"]

[tool.hatch.build.targets.wheel.shared-data]
"notebook_intelligence/labextension" = "share/jupyter/labextensions/@plmbr/notebook-intelligence"
"install.json" = "share/jupyter/labextensions/@plmbr/notebook-intelligence/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
"notebook_intelligence/chatbook_kernel/kernelspec" = "share/jupyter/kernels/chatbook"

[tool.hatch.build.hooks.version]
path = "notebook_intelligence/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "notebook_intelligence/labextension/static/style.js",
    "notebook_intelligence/labextension/package.json",
]
skip-if-exists = ["notebook_intelligence/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "notebook_intelligence/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.0.0,<5'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
